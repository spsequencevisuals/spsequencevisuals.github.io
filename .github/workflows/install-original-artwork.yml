name: Install original artwork into the portfolio

on:
  push:
    branches: [original-designs-2026-11-13]
    paths: [.github/workflows/install-original-artwork.yml]

permissions:
  contents: write

concurrency:
  group: install-original-artwork
  cancel-in-progress: false

jobs:
  install:
    if: github.repository == 'spsequencevisuals/spsequencevisuals.github.io' && github.ref == 'refs/heads/original-designs-2026-11-13'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify and place the uploaded artwork update
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil
          source = Path('lib/SP-Original-Designs-Website-Update')
          files = sorted(path for path in source.rglob('*') if path.is_file())
          assert len(files) == 58, 'The uploaded update must contain 58 files.'
          rows = []
          for path in files:
              assert not path.is_symlink(), 'Unexpected symbolic link.'
              relative = path.relative_to(source)
              assert relative.parts[0] in {'README.md', 'lib', 'public', 'tests', 'hosting'}
              rows.append([relative.as_posix(), hashlib.sha256(path.read_bytes()).hexdigest()])
          digest = hashlib.sha256(json.dumps(rows, separators=(',', ':')).encode()).hexdigest()
          assert digest == '3ba143aca7e82820f9d0d0f3132b394386132d5bf844dfd0fd971549e5ef6de0', 'The uploaded files differ from the verified update.'
          for path in files:
              target = Path(path.relative_to(source))
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(path, target)
          print('Verified and placed all 58 update files.')
          PY
      - name: Check artwork galleries and video playback
        run: node --test tests/design-collections.test.mjs tests/portable-portfolio.test.mjs tests/video-playback.test.mjs
      - name: Check the owner service
        run: npm test --prefix hosting/owner-service
      - name: Build the 43-project portfolio
        run: |
          node --input-type=module -e "import {defaultProjects} from './lib/portfolio-defaults.mjs'; if(defaultProjects.length !== 43) throw new Error('Expected 43 projects.');"
          node scripts/export-github-pages.mjs --origin https://spsequencevisuals.github.io --base / --out out
      - name: Save the verified update and remove the temporary installer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md lib/design-projects.mjs lib/portfolio-defaults.mjs lib/project-page.ts public/app.js public/photo-gallery.js public/assets/design tests/design-collections.test.mjs tests/portable-portfolio.test.mjs hosting/owner-service/tests/owner.test.mjs
          git rm -r -- lib/SP-Original-Designs-Website-Update
          git rm -- .github/workflows/install-original-artwork.yml
          git commit -m 'Install original artwork collections in the portfolio source'
          git push origin HEAD:original-designs-2026-11-13
