name: Install verified owner studio update
on:
  push:
    branches: [owner-connection-2026-11-13]
    paths: [.github/workflows/install-owner-studio.yml]
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply the prepared source update
        env:
          UPDATE_PATCH_GZIP_B64: ''
          UPDATE_PATCH_SHA256: 'd91b794c632b8894a9dbbd13483f64000a36291a256362f94e7b3eb3d89f595d'
        run: |
          python - <<'PYCODE'
          import base64,gzip,hashlib,os,pathlib,subprocess
          raw=gzip.decompress(base64.b64decode(os.environ['UPDATE_PATCH_GZIP_B64']))
          assert hashlib.sha256(raw).hexdigest()==os.environ['UPDATE_PATCH_SHA256']
          path=pathlib.Path('/tmp/sp-owner-studio.patch');path.write_bytes(raw)
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply','--index','--exclude=.github/workflows/github-pages.yml',str(path)],check=True)
          PYCODE
      - name: Verify owner access, uploads and linked-video playback
        run: |
          npm test --prefix hosting/owner-service
          node --test tests/youtube-projects.test.mjs tests/youtube-playback.test.mjs tests/video-playback.test.mjs tests/design-collections.test.mjs tests/portable-portfolio.test.mjs
          node scripts/export-github-pages.mjs --origin https://spsequencevisuals.github.io --base / --out out
      - name: Verify the deployable Worker bundle
        run: |
          npm ci --prefix hosting/owner-service --no-audit --no-fund
          cd hosting/owner-service
          npx wrangler deploy --dry-run --outdir /tmp/sp-owner-worker
      - name: Commit the verified source and remove this one-time installer
        run: |
          git rm .github/workflows/install-owner-studio.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Connect personal uploads and YouTube portfolio videos'
          git push
