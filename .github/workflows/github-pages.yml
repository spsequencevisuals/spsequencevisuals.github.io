name: Publish SP Sequence Visuals to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/configure-pages@v5
      - name: Check private owner studio
        run: npm test --prefix hosting/owner-service
      - name: Check media links and playback
        run: node --test tests/youtube-projects.test.mjs tests/youtube-playback.test.mjs tests/video-playback.test.mjs tests/design-collections.test.mjs
      - name: Build portable portfolio
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          owner="${REPOSITORY%%/*}"
          repo="${REPOSITORY#*/}"
          base="/$repo/"
          if [ "${repo,,}" = "${owner,,}.github.io" ]; then base="/"; fi
          node scripts/export-github-pages.mjs --origin "https://$owner.github.io" --base "$base" --out out
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
